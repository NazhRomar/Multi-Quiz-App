<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Quiz App</title>
    <meta name="description" content="Practice quizzes and reviewers by term and subject — works offline." />
    <!-- PWA: installable app (manifest + service worker registered in src/main.jsx) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Status bar color: the default theme's header, replaced with the
         chosen theme's (utils/themes.js saves it) before anything paints. -->
    <meta name="theme-color" content="#f0f7fd" />
    <script>
      try {
        var barColor = localStorage.getItem('quizApp_statusBarColor');
        if (barColor) document.querySelector('meta[name="theme-color"]').setAttribute('content', barColor);
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Multi Quiz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app-root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
