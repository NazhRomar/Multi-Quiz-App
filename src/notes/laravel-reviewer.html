<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prelim MODULE Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef6fb;
    --surface: #243444;
    --surface2: #1b2834;
    --border: #384d63;
    --accent: #5dade2;
    --accent-hover: #7fc3eb;
    --accent2: #f9e79f;
    --accent3: #aed6f1;
    --text: #fcfbf7;
    --text-muted: #d0dae5;
    --text-dim: #ebdcb9;
    --nav-idle: #e3edf7;
    --code-bg: #151f28;
    --code-text: #f9e79f;
    --green: #82e0aa;
    --header-bg: rgba(27, 40, 52, 0.96);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(93, 173, 226, 0.28) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(174, 214, 241, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(249, 231, 159, 0.12) 0%, transparent 70%);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  a{color: var(--accent2);}

  /* ---------- Top bar ---------- */
  header.top{
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg);
    border-bottom: 2px solid rgba(93, 173, 226, 0.35);
    box-shadow: 0 2px 20px rgba(27, 40, 52, 0.25);
    backdrop-filter: blur(12px);
    padding: 0.9rem 1.8rem;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .brand{display: flex; align-items: center; gap: 12px;}
  .brand .mark{
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #2874a6);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; color: #fff;
    box-shadow: 0 4px 14px rgba(93, 173, 226, 0.35);
  }
  .brand h1{
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem; font-weight: 700; letter-spacing: 0.04em;
    color: var(--text); text-transform: uppercase; margin: 0;
  }
  .brand p{margin: 0; font-size: 0.7rem; color: var(--text-muted); font-family: 'Space Mono', monospace; margin-top: 2px;}

  nav.tabs{display: flex; gap: 8px; flex-wrap: wrap;}
  nav.tabs button{
    background: var(--surface);
    color: var(--nav-idle);
    border: 1px solid var(--border);
    padding: 0.45rem 1.1rem;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all .2s ease;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
  }
  nav.tabs button:hover{
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  nav.tabs button.active{
    background: linear-gradient(135deg, var(--accent), #2e86c1);
    color: #ffffff;
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(93, 173, 226, 0.35);
  }

  /* ---------- Layout ---------- */
  .shell{
    display: grid;
    grid-template-columns: 280px minmax(0,1fr);
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  aside.side{
    padding: 22px 16px;
    position: sticky; top: 88px;
    align-self: start;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(27, 40, 52, 0.12);
  }
  aside.side h3{
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent); margin: 0 0 12px; padding: 0 8px 8px;
    font-family: 'Space Mono', monospace;
    border-bottom: 1px solid var(--border);
  }
  aside.side a{
    display: block; 
    color: var(--nav-idle);
    font-weight: 600;
    text-decoration: none;
    font-size: 0.88rem; 
    padding: 9px 12px; 
    border-radius: 8px;
    transition: all .15s ease;
    line-height: 1.35;
    margin-bottom: 4px;
  }
  aside.side a:hover{
    color: #ffffff;
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    padding-left: 14px;
  }

  main{ padding: 0 8px 80px; min-width: 0; }

  .module{ display: none; }
  .module.active{ display: block; }

  .module-hero{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.2rem 2.4rem;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 24px rgba(27, 40, 52, 0.12);
  }
  .module-hero::before{
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #5dade2, #aed6f1, #f9e79f, #82e0aa);
  }
  .module-hero .kicker{
    color: var(--accent2); font-size: 0.72rem; font-weight: 700;
    font-family: 'Space Mono', monospace; letter-spacing: 0.1em;
  }
  .module-hero h2{
    margin: 6px 0 8px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 700; color: var(--text);
  }
  .module-hero p{ margin: 0; color: var(--text-muted); max-width: 640px; font-size: 0.95rem;}

  section.topic{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 26px;
    margin-bottom: 20px;
    scroll-margin-top: 95px;
    box-shadow: 0 2px 20px rgba(27, 40, 52, 0.08);
  }
  section.topic h3{
    margin: 0 0 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.45rem; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  section.topic h3 .dot{
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    flex: none; box-shadow: 0 0 8px var(--accent);
  }
  section.topic p{ color: var(--text); font-size: 0.95rem; margin: 8px 0; }
  section.topic ul{ margin: 8px 0; padding-left: 20px; color: var(--text); font-size: 0.95rem;}
  section.topic li{ margin: 6px 0; }
  section.topic strong{ color: #ffffff; }

  code.inline{
    background: var(--code-bg);
    color: var(--code-text);
    padding: 2px 6px;
    border-radius: 5px;
    font-family: 'Space Mono', monospace;
    font-size: 0.86em;
    border: 1px solid rgba(93, 173, 226, 0.25);
  }
  pre{
    background: var(--code-bg);
    border: 1px solid rgba(93, 173, 226, 0.25);
    border-radius: 10px;
    padding: 14px 18px;
    overflow-x: auto;
    margin: 14px 0;
  }
  pre code{
    font-family: 'Space Mono', monospace;
    color: var(--code-text);
    font-size: 0.88rem;
    line-height: 1.6;
    white-space: pre;
  }
  .comment{color: #8fa0b0;}
  .kw{color: #f1948a;}
  .str{color: var(--green);}

  .callout{
    border-left: 3px solid var(--accent2);
    background: rgba(249, 231, 159, 0.12);
    padding: 12px 16px;
    border-radius: 0 10px 10px 0;
    font-size: 0.9rem;
    color: var(--text-dim);
    margin: 14px 0;
    font-family: 'Space Mono', monospace;
  }

  .grid2{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media(max-width:720px){ .grid2, .grid3{ grid-template-columns: 1fr; } }

  .chip-row{ display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip{
    background: var(--surface2); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; color: var(--text);
    font-family: 'Space Mono', monospace;
  }
  .chip b{ color: var(--accent2); }

  table.mvc{ width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem;}
  table.mvc th, table.mvc td{ border: 1px solid var(--border); padding: 10px 14px; text-align: left; vertical-align: top;}
  table.mvc th{
    background: var(--surface2); color: var(--accent2);
    font-family: 'Space Mono', monospace; font-size: 0.82rem; text-transform: uppercase;
  }

  .folder{
    display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--border);
  }
  .folder:last-child{border-bottom: none;}
  .folder .f-name{
    font-family: 'Space Mono', monospace; color: var(--accent); min-width: 130px; font-size: 0.88rem;
  }
  .folder .f-desc{ color: var(--text); font-size: 0.92rem; }

  footer.pagebar{
    display: flex; justify-content: space-between; margin-top: 24px;
    padding-top: 16px; border-top: 1px solid var(--border);
  }
  footer.pagebar button{
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 700;
    font-family: 'Nunito', sans-serif; transition: all .2s ease;
  }
  footer.pagebar button:hover{
    border-color: var(--accent); color: var(--accent);
    transform: translateY(-2px);
  }

  @media(max-width:880px){
    .shell{grid-template-columns: 1fr; padding: 16px 10px;}
    aside.side{position: relative; top: 0; max-height: none; margin-bottom: 20px;}
    header.top{padding: 0.75rem 1rem;}
    main{padding: 0 4px 60px;}
    .module-hero{padding: 1.5rem 1.3rem;}
  }

  /* =====================================================
     QUIZ ADDITIONS (built on the reviewer's theme above)
     ===================================================== */
  .shell.solo{ grid-template-columns: minmax(0,1fr); max-width: 900px; }
  .shell.solo aside.side{ display: none; }
  footer.pagebar button:disabled{ opacity: .4; cursor: not-allowed; transform: none; }
  footer.pagebar button:disabled:hover{ border-color: var(--border); color: var(--text); }

  .btn{
    background: linear-gradient(135deg, var(--accent), #2e86c1); color: #fff;
    border: 1px solid var(--accent); padding: 11px 22px; border-radius: 12px; cursor: pointer;
    font-size: .9rem; font-weight: 800; font-family: 'Nunito', sans-serif; transition: all .2s ease;
    box-shadow: 0 4px 14px rgba(93,173,226,.3);
  }
  .btn:hover{ transform: translateY(-2px); background: linear-gradient(135deg, var(--accent-hover), var(--accent)); }
  .btn.ghost{ background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: none; }
  .btn.ghost:hover{ border-color: var(--accent); color: var(--accent); }
  .btn.sm{ padding: 7px 14px; font-size: .8rem; border-radius: 10px; }
  .btn:disabled{ opacity: .45; cursor: not-allowed; transform: none; }
  .btn-row{ display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }

  /* switches */
  .switch{ position: relative; width: 50px; height: 28px; flex: none; display: inline-block; }
  .switch input{ opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .track{
    position: absolute; inset: 0; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 999px; transition: .2s; cursor: pointer;
  }
  .switch .track::after{
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--nav-idle); transition: .2s;
  }
  .switch input:checked + .track{ background: linear-gradient(135deg, var(--accent), #2e86c1); border-color: var(--accent); }
  .switch input:checked + .track::after{ transform: translateX(22px); background: #fff; }
  .switch input:focus-visible + .track{ outline: 2px solid var(--accent2); outline-offset: 2px; }

  .switch-row{
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 14px 0; border-bottom: 1px dashed var(--border); cursor: pointer;
  }
  .switch-row:last-of-type{ border-bottom: none; }
  .sw-title{ display: block; font-weight: 800; color: #fff; }
  .sw-desc{ display: block; font-size: .85rem; color: var(--text-muted); margin-top: 2px; }

  .toolbar{ display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; }
  .toolbar .grow{ flex: 1; min-width: 220px; }
  .tgl{ display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
  .mini{ display: inline-flex; align-items: center; gap: 10px; font-size: .82rem; font-weight: 700; color: var(--text); cursor: pointer; user-select: none; }
  .mini .switch{ width: 40px; height: 22px; }
  .mini .switch .track::after{ width: 14px; height: 14px; top: 3px; left: 3px; }
  .mini .switch input:checked + .track::after{ transform: translateX(18px); }

  .small{ font-family: 'Space Mono', monospace; font-size: .75rem; color: var(--text-muted); margin-bottom: 6px; }
  .bar{ height: 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
  .bar > i{ display: block; height: 100%; background: linear-gradient(90deg,#5dade2,#aed6f1,#f9e79f,#82e0aa); transition: width .25s; }

  input.search{
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; font-family: 'Nunito', sans-serif; font-size: .9rem; min-width: 220px; flex: 1; max-width: 340px;
  }
  input.search:focus{ outline: none; border-color: var(--accent); }
  .count{ font-family: 'Space Mono', monospace; font-size: .75rem; color: var(--text-muted); }

  /* question card */
  .qhead{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .qhead .chip{ padding: 3px 10px; }
  .qnum{
    background: var(--surface2); border: 1px solid var(--accent); color: var(--accent2);
    font-family: 'Space Mono', monospace; font-weight: 700; padding: 3px 10px; border-radius: 8px; font-size: .8rem;
  }
  section.topic p.prompt{ font-size: 1.05rem; font-weight: 700; line-height: 1.55; margin: 4px 0 10px; color: #fff; }
  section.topic p.hint{ font-size: .8rem; color: var(--text-muted); font-family: 'Space Mono', monospace; margin: 4px 0 8px; }
  section.topic p.sentence{ font-size: 1rem; margin: 14px 0; }

  .opts{ margin: 12px 0 4px; }
  .opt{
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--surface2); margin: 8px 0; cursor: pointer;
    transition: border-color .15s, background .15s; font-size: .95rem; color: var(--text);
  }
  .opt:hover{ border-color: var(--accent); }
  .opt input{ accent-color: var(--accent); width: 18px; height: 18px; flex: none; margin: 0; }
  .opt.sel{ border-color: var(--accent); background: rgba(93,173,226,.18); }
  .opt.static{ cursor: default; }
  .opt.static:hover{ border-color: var(--border); }
  .mono{ font-family: 'Space Mono', monospace; font-size: .86rem; color: var(--code-text); word-break: break-word; }
  .opt .mark{
    width: 22px; height: 22px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: .8rem;
  }
  .tag{ margin-left: auto; font-family: 'Space Mono', monospace; font-size: .68rem; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .tag.ok{ background: rgba(130,224,170,.2); color: var(--green); }
  .tag.you{ background: rgba(93,173,226,.22); color: var(--accent3); }
  .opt.picked{ border-color: var(--accent); }
  .opt.is-correct{ border-color: var(--green); background: rgba(130,224,170,.14); }
  .opt.is-correct .mark{ background: var(--green); color: #10281a; }
  .opt.is-wrong{ border-color: #f1948a; background: rgba(241,148,138,.14); }
  .opt.is-wrong .mark{ background: #f1948a; color: #3a1410; }

  /* fill in the blank */
  input.blank{
    background: var(--surface); color: var(--text); border: 1px solid var(--accent); border-radius: 6px;
    padding: 3px 8px; font-family: 'Space Mono', monospace; font-size: .84rem; min-width: 70px; outline: none;
  }
  input.blank:focus{ border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(249,231,159,.25); }
  .blank-rv{
    display: inline-block; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border);
    font-family: 'Space Mono', monospace; font-size: .84rem;
  }
  .blank-rv.ok, .blank-rv.rev{ border-color: var(--green); color: var(--green); background: rgba(130,224,170,.12); }
  .blank-rv.bad{ border-color: #f1948a; color: #f1948a; background: rgba(241,148,138,.12); }
  .blank-rv.bad .u{ text-decoration: line-through; }
  .blank-rv .c{ color: var(--green); margin-left: 6px; }

  /* matching */
  .mrow{ display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; align-items: center; margin: 8px 0; }
  .mleft{ padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface2); font-size: .95rem; }
  select.msel{
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; font-family: 'Nunito', sans-serif; font-size: .92rem; width: 100%;
  }
  select.msel:focus{ outline: none; border-color: var(--accent); }
  .m-ans{ padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: .92rem; background: var(--surface2); }
  .m-ans.ok, .m-ans.rev{ border-color: var(--green); background: rgba(130,224,170,.14); }
  .m-ans.bad{ border-color: #f1948a; background: rgba(241,148,138,.14); }
  .m-ans.bad .u{ text-decoration: line-through; }
  .m-ans .c{ color: var(--green); font-weight: 800; }
  @media(max-width:720px){ .mrow{ grid-template-columns: 1fr; } }

  /* hide-correct-answers mode (self test) */
  .hide-ans .rv-hide{ display: none !important; }
  .explain{ margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--accent2); background: var(--surface2); border-radius: 8px; font-size: .88rem; color: var(--text-muted); line-height: 1.55; }
  .explain .elabel{ display: block; color: var(--accent2); font-family: 'Space Mono', monospace; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .hide-ans .opt.is-correct, .hide-ans .opt.is-wrong{ border-color: var(--border); background: var(--surface2); }
  .hide-ans .opt.picked{ border-color: var(--accent); background: rgba(93,173,226,.18); }
  .mask{ display: none; }
  .hide-ans .mask{ display: inline; color: var(--text-muted); }
  .hide-ans .blank-rv, .hide-ans .m-ans{ border-color: var(--border); background: var(--surface2); color: var(--code-text); }
  .hide-ans .m-ans{ color: var(--text); }
  .hide-ans .blank-rv.bad .u, .hide-ans .m-ans.bad .u{ text-decoration: none; }

  /* navigator */
  .side-meta{ font-family: 'Space Mono', monospace; font-size: .75rem; color: var(--text-muted); margin: 0 8px 12px; }
  .qgrid{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .qn{
    padding: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--nav-idle); font-family: 'Space Mono', monospace; font-size: .78rem; font-weight: 700; cursor: pointer;
  }
  .qn:hover{ border-color: var(--accent); color: #fff; }
  .qn.done{ background: rgba(93,173,226,.25); border-color: var(--accent); color: #fff; }
  .qn.cur{ outline: 2px solid var(--accent2); outline-offset: 1px; }
  .qn.ok{ background: rgba(130,224,170,.25); border-color: var(--green); color: #fff; }
  .qn.bad{ background: rgba(241,148,138,.25); border-color: #f1948a; color: #fff; }
  .qn.part{ background: rgba(249,231,159,.22); border-color: var(--accent2); color: #fff; }
  .legend{ display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 8px 0; font-size: .7rem; color: var(--text-muted); font-family: 'Space Mono', monospace; }
  .legend i{ display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--border); }

  /* results */
  .status{ font-family: 'Space Mono', monospace; font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .status.ok{ background: rgba(130,224,170,.2); color: var(--green); }
  .status.bad{ background: rgba(241,148,138,.2); color: #f1948a; }
  .status.part{ background: rgba(249,231,159,.2); color: var(--accent2); }
  .res{ display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .ring{
    width: 150px; height: 150px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--surface2) 0);
  }
  .ring > div{ width: 118px; height: 118px; border-radius: 50%; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring b{ font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; line-height: 1; }
  .ring span{ font-family: 'Space Mono', monospace; font-size: .7rem; color: var(--text-muted); margin-top: 4px; }
  button.fchip{
    background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 999px;
    font-family: 'Space Mono', monospace; font-size: .78rem; font-weight: 700; cursor: pointer; transition: all .15s;
  }
  button.fchip:hover{ border-color: var(--accent); }

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm = s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ');
const isCode = s=>/^(\$|@|->|Route::|php |composer |laravel |artisan |return |'|\{\{|<|\.|\/|[a-z_]+\(|[a-z]+\/[a-z.]+|[^A-Za-z0-9\s]{1,3}$)/i.test(s);
const scrollTop = ()=>window.scrollTo({top:0,behavior:'smooth'});
const fmt = ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s';};

const TYPE={mc:'Multiple Choice',tf:'True or False',multi:'Multiple Answer',fill:'Fill in the Blank',match:'Matching'};
const maxPts = q=> q.type==='multi'?q.ans.length : q.type==='fill'?q.blanks.length : q.type==='match'?q.pairs.length : 1;

function isAns(q,a){
  if(a==null) return false;
  if(q.type==='multi') return a.length>0;
  if(q.type==='fill'||q.type==='match') return a.some(x=>x && String(x).trim());
  return true;
}
function grade(q,a){
  const max=maxPts(q); let pts=0;
  if(isAns(q,a)){
    if(q.type==='mc'||q.type==='tf') pts = a===q.ans?1:0;
    else if(q.type==='multi'){ const hit=a.filter(i=>q.ans.includes(i)).length; pts=Math.max(0,hit-(a.length-hit)); }
    else if(q.type==='fill') pts=q.blanks.reduce((s,b,i)=>s+(b.a.map(norm).includes(norm(a[i]))?1:0),0);
    else if(q.type==='match') pts=q.pairs.reduce((s,p,i)=>s+(a[i]===p[1]?1:0),0);
  }
  return {pts,max,answered:isAns(q,a),status:pts===max?'ok':pts===0?'bad':'part'};
}

const S={
  view:'home', instant:true, shuffleQ:false, shuffleO:false, reviewFirst:false,
  rvReveal:true, search:'', review:{order:[],opt:{}}, exam:null
};

/* option order (per question, per store) */
function ord(q,store){
  if(store[q.id]) return store[q.id];
  let o;
  if(q.type==='match'){
    const id=[...Array(q.pairs.length).keys()];
    o={l:S.shuffleO?shuffle(id):id, r:S.shuffleO?shuffle(id):id};
  } else if(q.type==='fill'){
    o=[];
  } else {
    const id=[...Array(q.opts.length).keys()];
    o=(S.shuffleO&&!q.fixed)?shuffle(id):id;
  }
  store[q.id]=o; return o;
}

/* ============================================================
   SHARED RENDER PIECES
   ============================================================ */
function switchRow(key,title,desc,on){
  return `<label class="switch-row"><span><span class="sw-title">${title}</span><span class="sw-desc">${desc}</span></span><span class="switch"><input type="checkbox" data-set="${key}"${on?' checked':''}><span class="track"></span></span></label>`;
}
function mini(key,text,on){
  return `<label class="mini"><span class="switch"><input type="checkbox" data-set="${key}"${on?' checked':''}><span class="track"></span></span><span>${text}</span></label>`;
}
function promptHTML(q){
  return `<p class="prompt">${esc(q.q)}</p>` + (q.code?`<pre><code>${esc(q.code)}</code></pre>`:'');
}
function tplHTML(q,fn){
  const html=q.tpl.split(/\[\[(\d+)\]\]/).map((s,i)=>i%2?fn(+s-1):esc(s)).join('');
  return q.mono?`<pre class="tpl"><code>${html}</code></pre>`:`<p class="sentence">${html}</p>`;
}
function chips(q){
  const p=maxPts(q);
  return `<span class="chip">${TYPE[q.type]}</span><span class="chip"><b>${p}</b> pt${p>1?'s':''}</span>`;
}

/* exam inputs */
function inputHTML(q,e){
  const a=e.answers[q.id], o=ord(q,e.opt);
  if(q.type==='mc'||q.type==='tf'){
    return `<div class="opts">`+o.map(i=>`<label class="opt${a===i?' sel':''}"><input type="radio" name="o" value="${i}"${a===i?' checked':''}><span${isCode(q.opts[i])?' class="mono"':''}>${esc(q.opts[i])}</span></label>`).join('')+`</div>`;
  }
  if(q.type==='multi'){
    const A=a||[];
    return `<p class="hint">Select all that apply.</p><div class="opts">`+o.map(i=>`<label class="opt${A.includes(i)?' sel':''}"><input type="checkbox" name="m" value="${i}"${A.includes(i)?' checked':''}><span${isCode(q.opts[i])?' class="mono"':''}>${esc(q.opts[i])}</span></label>`).join('')+`</div>`;
  }
  if(q.type==='fill'){
    const A=a||[];
    return `<p class="hint">Type your answer in each numbered blank.</p>`+tplHTML(q,i=>{
      const v=A[i]||'';
      return `<input class="blank" data-b="${i}" value="${esc(v)}" placeholder="${i+1}" size="${Math.max(9,q.blanks[i].a[0].length+3)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Blank ${i+1}">`;
    });
  }
  if(q.type==='match'){
    const A=a||[];
    return `<p class="hint">Match each item with the correct choice.</p>`+o.l.map(i=>`<div class="mrow"><div class="mleft">${esc(q.pairs[i][0])}</div><select class="msel" data-i="${i}"><option value="">Choose…</option>${o.r.map(j=>{const v=q.pairs[j][1];return `<option value="${esc(v)}"${A[i]===v?' selected':''}>${esc(v)}</option>`;}).join('')}</select></div>`).join('');
  }
  return '';
}

/* review body: a === undefined/null for pre-exam review */
function reviewBody(q,a,store){
  const o=ord(q,store);
  if(q.type==='mc'||q.type==='tf'||q.type==='multi'){
    const corr=q.type==='multi'?q.ans:[q.ans];
    const picked=a==null?[]:(q.type==='multi'?a:[a]);
    return `<div class="opts">`+o.map(i=>{
      const c=corr.includes(i), p=picked.includes(i);
      const cls=['opt','static']; if(c)cls.push('is-correct'); if(p)cls.push('picked'); if(p&&!c)cls.push('is-wrong');
      const mark=c?'✓':(p?'✗':'');
      return `<div class="${cls.join(' ')}"><span class="mark rv-hide">${mark}</span><span${isCode(q.opts[i])?' class="mono"':''}>${esc(q.opts[i])}</span>${p?'<span class="tag you">Your answer</span>':''}${c?'<span class="tag ok rv-hide">Correct answer</span>':''}</div>`;
    }).join('')+`</div>`;
  }
  if(q.type==='fill'){
    return tplHTML(q,i=>{
      const b=q.blanks[i], c=esc(b.a[0]);
      if(a==null) return `<span class="blank-rv rev"><span class="rv-hide">${c}</span><span class="mask">______</span></span>`;
      const u=a[i]||''; const ok=b.a.map(norm).includes(norm(u));
      return `<span class="blank-rv ${ok?'ok':'bad'}"><span class="u">${esc(u)||'—'}</span>${ok?'':`<span class="c rv-hide">→ ${c}</span>`}</span>`;
    });
  }
  if(q.type==='match'){
    return o.l.map(i=>{
      const [left,right]=q.pairs[i];
      let r;
      if(a==null) r=`<div class="m-ans rev"><span class="rv-hide c">${esc(right)}</span><span class="mask">______</span></div>`;
      else { const u=a[i]||''; const ok=u===right; r=`<div class="m-ans ${ok?'ok':'bad'}"><span class="u">${esc(u)||'—'}</span>${ok?'':`<span class="rv-hide c"> → ${esc(right)}</span>`}</div>`; }
      return `<div class="mrow"><div class="mleft">${esc(left)}</div>${r}</div>`;
    }).join('');
  }
  return '';
}

function card(q,n,a,store,g,prefix){
  let badge='';
  if(g){
    const txt=!g.answered?'Not answered':g.status==='ok'?`Correct · ${g.pts}/${g.max}`:g.status==='part'?`Partial · ${g.pts}/${g.max}`:`Incorrect · ${g.pts}/${g.max}`;
    badge=`<span class="status ${g.answered?g.status:'bad'}">${txt}</span>`;
  }
  return `<section class="topic qcard" id="${prefix}${q.id}"><div class="qhead"><span class="qnum">#${n}</span>${chips(q)}${badge}</div>${promptHTML(q)}${reviewBody(q,a,store)}${(!g&&q.exp)?`<div class="explain rv-hide"><span class="elabel">Explanation</span>${esc(q.exp)}</div>`:''}</section>`;
}

function reviewList(){
  const t=S.search.trim().toLowerCase();
  let shown=0;

    return card(q,p+1,null,S.review.opt,null,'rv-');

function examCard(q,e){
  const a=e.answers[q.id];

    const g=grade(q,a);
    const label=g.status==='ok'?'Correct':g.status==='part'?`Partial · ${g.pts}/${g.max}`:'Incorrect';
    const msg=g.status==='ok'?'Correct! Nice one.':g.status==='part'?`Partially correct — ${g.pts} of ${g.max} points. The correct answer is shown below.`:'Incorrect — the correct answer is highlighted below.';
    return `<section class="topic qcard fb-${g.status}"><div class="qhead"><span class="qnum">Q${e.pos+1}</span>${chips(q)}<span class="status ${g.status}">${label}</span></div>${promptHTML(q)}<div class="banner ${g.status}" role="status">${msg}</div>${reviewBody(q,a,e.opt)}</section>`;

   ============================================================ */
function render(){
  const v=S.view;
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===(v==='results'?'exam':v)));
  $('#shell').classList.toggle('solo',v==='home'||v==='review');
  $('#main').innerHTML = v==='home'?viewHome():v==='review'?viewReview():v==='exam'?viewExam():viewResults();
  $('#side').innerHTML = v==='exam'?sideExam():v==='results'?sideResults():'';
}

function buildReview(){
  const ids=Q.map(q=>q.id);
  S.review.order=S.shuffleQ?shuffle(ids):ids;
  S.review.opt={};
}
function openReview(){ buildReview(); S.search=''; S.view='review'; render(); scrollTop(); }

function startExam(pool){
  if(S.exam&&!S.exam.done&&pool===undefined&&S.view==='review'){ S.view='exam'; render(); scrollTop(); return; } // resume
  pool=pool||Q.map(q=>q.id);
  S.exam={pool,order:S.shuffleQ?shuffle(pool):pool.slice(),pos:0,answers:{},opt:{},checked:{},startedAt:Date.now(),endedAt:0,done:false,filter:'all',reveal:true};
  S.view='exam'; render(); scrollTop();
}

function nav(d){
  const e=S.exam; e.pos=Math.min(e.order.length-1,Math.max(0,e.pos+d));
  render(); scrollTop();
}
function modal(msg,okText,onOk){
  const d=document.createElement('div'); d.className='overlay';
  d.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h3>Submit exam?</h3><p>${msg}</p><div class="btn-row"><button class="btn" id="mOk">${okText}</button><button class="btn ghost" id="mNo">Keep working</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#mNo').onclick=()=>d.remove();
  d.querySelector('#mOk').onclick=()=>{d.remove();onOk();};
  d.addEventListener('click',ev=>{if(ev.target===d)d.remove();});
}
function finishNow(){ const e=S.exam; e.done=true; e.endedAt=Date.now(); S.view='results'; render(); scrollTop(); }
function askFinish(){
  const e=S.exam, un=e.pool.length-answeredCount(e);
  if(!un) return finishNow();
  modal(`You still have <b>${un}</b> unanswered question${un>1?'s':''}. Unanswered questions score zero.`,'Submit anyway',finishNow);
}

/* live randomize while taking the exam */
function reorderRemaining(){
  const e=S.exam; if(!e||e.done) return;
  const idx=[]; for(let p=e.pos+1;p<e.order.length;p++){ if(!isAns(Q[e.order[p]],e.answers[e.order[p]])) idx.push(p); }
  let ids=idx.map(p=>e.order[p]);
  ids=S.shuffleQ?shuffle(ids):ids.sort((x,y)=>x-y);
  idx.forEach((p,k)=>e.order[p]=ids[k]);
}
function resetUnansweredOpts(){
  const e=S.exam; if(!e||e.done) return;
  e.pool.forEach(id=>{ if(!isAns(Q[id],e.answers[id])) delete e.opt[id]; });
}

function setOpt(k,v){
  if(k==='rvReveal'){ S.rvReveal=v; $('#rvList').classList.toggle('hide-ans',!v); return; }
  if(k==='exReveal'){ S.exam.reveal=v; $('#resList').classList.toggle('hide-ans',!v); return; }
  S[k]=v;
  if(k==='shuffleQ'){ if(S.view==='review') buildReview(); if(S.view==='exam') reorderRemaining(); }
  if(k==='shuffleO'){ if(S.view==='review') S.review.opt={}; if(S.view==='exam') resetUnansweredOpts(); }
  render();
}

function tab(v){
  if(v==='home'){ S.view='home'; render(); scrollTop(); }
  else if(v==='review'){ openReview(); }
  else if(v==='exam'){
    if(S.exam){ S.view=S.exam.done?'results':'exam'; render(); scrollTop(); }
    else startExam();
  }
}

/* refresh just the progress bits (keeps typing focus) */
function upd(){
  const e=S.exam; if(!e||S.view!=='exam') return;
  const d=answeredCount(e), n=e.order.length;
  $('#prog').textContent=`Question ${e.pos+1} of ${n} · ${d} answered`;
  $('#barfill').style.width=Math.round(d/n*100)+'%';
  $('#side').innerHTML=sideExam();
  const cb=document.querySelector('[data-act=check]');
  if(cb){ const q=Q[e.order[e.pos]]; cb.disabled=!isAns(q,e.answers[q.id]); }
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]'); if(!t) return;
  const e=S.exam;
  switch(t.dataset.act){
    case 'tab': tab(t.dataset.view); break;
    case 'begin': S.reviewFirst?openReview():startExam(); break;
    case 'alt': S.reviewFirst?startExam():openReview(); break;
    case 'startExam': startExam(); break;
    case 'home': S.view='home'; render(); scrollTop(); break;
    case 'reshuffle': buildReview(); render(); break;
    case 'prev': nav(-1); break;
    case 'next': nav(1); break;
    case 'goto': e.pos=+t.dataset.p; render(); scrollTop(); break;
    case 'check': { const q=Q[e.order[e.pos]]; if(isAns(q,e.answers[q.id])){ e.checked[q.id]=true; render(); } break; }
    case 'finish': askFinish(); break;
    case 'retake': startExam(Q.map(q=>q.id)); break;
    case 'retry': startExam(missedIds()); break;
    case 'filter': e.filter=t.dataset.f; render(); break;
    case 'jump': {
      if(e.filter!=='all'){ e.filter='all'; render(); }
      const el=document.getElementById('rq-'+t.dataset.id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
      break;
    }
  }
});

document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.set){
    if(t.dataset.set==='reviewFirst'){ S.reviewFirst=t.checked; render(); }
    else setOpt(t.dataset.set,t.checked);
    return;
  }
  const e=S.exam; if(S.view!=='exam'||!e) return;
  const q=Q[e.order[e.pos]];
  if(t.name==='o'){ e.answers[q.id]=+t.value; if(S.instant){ e.checked[q.id]=true; render(); } else { markSel(); upd(); } }
  else if(t.name==='m'){ e.answers[q.id]=[...document.querySelectorAll('input[name=m]:checked')].map(x=>+x.value); markSel(); upd(); }
  else if(t.classList.contains('msel')){ const a=e.answers[q.id]||(e.answers[q.id]=[]); a[+t.dataset.i]=t.value; upd(); }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='rvSearch'){ S.search=t.value; paintReview(); return; }
  const e=S.exam;
  if(t.classList&&t.classList.contains('blank')&&e&&S.view==='exam'){
    const q=Q[e.order[e.pos]]; const a=e.answers[q.id]||(e.answers[q.id]=[]); a[+t.dataset.b]=t.value; upd();
  }
});
function markSel(){ document.querySelectorAll('.opts .opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked)); }

render();
</script>
</body>
</html>
