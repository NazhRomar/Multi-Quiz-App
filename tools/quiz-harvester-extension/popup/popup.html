<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quiz Harvester</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif; margin: 0; padding: 14px;
      background: #111827; color: #e5e7eb; display: flex; flex-direction: column; gap: 10px;
    }
    h1 { font-size: 14px; margin: 0; }
    label { font-size: 11px; color: #9ca3af; display: block; margin-bottom: 4px; }
    input[type=text] {
      width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #374151;
      background: #1f2937; color: #e5e7eb; font-size: 13px;
    }
    #targetBox {
      background: #1f2937; border-radius: 8px; padding: 8px 10px; font-size: 12px;
    }
    #targetTitle { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #targetUrl { color: #6b7280; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .count { font-weight: 700; color: #4ade80; }
    .needs-review { color: #f59e0b; font-weight: 700; }
    button {
      padding: 9px; border: none; border-radius: 6px; font-size: 13px;
      font-weight: 700; cursor: pointer;
    }
    #startBtn { background: #16a34a; color: white; }
    #startBtn.armed { background: #dc2626; }
    #startBtn:hover { filter: brightness(1.1); }
    #export { background: #2563eb; color: white; }
    #export:hover { background: #1d4ed8; }
    #clear { background: #374151; color: #e5e7eb; }
    #clear:hover { background: #4b5563; }
    hr { border: none; border-top: 1px solid #1f2937; margin: 2px 0; }
    #list { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .qitem { background: #1f2937; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .qitem-head { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
    .dot-green { background: #22c55e; }
    .dot-amber { background: #f59e0b; }
    .qtext { font-weight: 600; line-height: 1.3; }
    .opts { list-style: none; margin: 0; padding: 0 0 0 15px; }
    .opts li { padding: 1px 0; color: #cbd5e1; }
    .opt-correct { color: #4ade80 !important; font-weight: 600; }
    .opt-pickable { cursor: pointer; text-decoration: underline dotted; }
    .opt-pickable:hover { color: white !important; }
    pre.code { background: #030712; padding: 6px; border-radius: 6px; overflow-x: auto; white-space: pre; margin-top: 4px; font-size: 11px; }
    p.hint { font-size: 11px; color: #6b7280; line-height: 1.4; margin: 0; }
    #empty { color: #6b7280; font-size: 12px; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <h1>Quiz Harvester</h1>

  <div id="targetBox">
    <div id="targetTitle">No tab selected</div>
    <div id="targetUrl"></div>
  </div>

  <button id="startBtn">Start Capturing</button>

  <label for="sessionName">Session name</label>
  <input type="text" id="sessionName" placeholder="e.g. ccna-icnd1" />

  <div class="row"><span>Captured</span><span class="count" id="capturedCount">0</span></div>
  <div class="row"><span>Needs review</span><span class="needs-review" id="reviewCount">0</span></div>

  <button id="export">Export session as JSON</button>
  <button id="clear">Clear this session</button>

  <hr />
  <div id="list"><div id="empty">Nothing captured yet.</div></div>

  <p class="hint">Read-only: never clicks or submits anything on the page. You navigate the quiz yourself.</p>

  <script src="popup.js"></script>
</body>
</html>
